<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
  </head>
  <body>
    
    <!-- Instructive text -->
    <div style="position: absolute; top: 2%; left: 2%; z-index: 10000; color: white; font-size: clamp(18px, 3.75vw, 36px); font-family: sans-serif; text-shadow: 1px 1px 2px rgba(0,0,0,0.7);">
      Tap to select object, then rotate and zoom
    </div>

    <!-- Buttons to freeze/unfreeze the AR -->
    <div id="arButtons" style="position: absolute; z-index: 10000;">
      <button id="pause-keep-video-button">Freeze</button>
      <button id="unpause-button">Unfreeze</button>
    </div>

    <!-- Script to freeze/unfreeze AR -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        let arSystem;
        sceneEl.addEventListener('loaded', function () {
          arSystem = sceneEl.systems["mindar-image-system"];
        });
        document.querySelector("#pause-keep-video-button").addEventListener('click', () => {
          if (arSystem) arSystem.pause(true); // pause AR, keep video
          sceneEl.pause(); // pause the A-Frame scene (stops gestures, animations, ticks)
        });
        document.querySelector("#unpause-button").addEventListener('click', () => {
          sceneEl.play(); // resume the A-Frame scene
          if (arSystem) arSystem.unpause(); // unpause AR and video
        });
      });
    </script>

    <style>
      #arButtons {
        position: absolute;
        bottom: 2%;
        left: 0;
        right: 0;
        z-index: 10000;
        display: flex;
        justify-content: stretch;
      }

      #pause-keep-video-button,
      #unpause-button {
        flex: 1;
        font-size: 20px;
      }
    </style>

    <!-- Script to set the environment texture -->
    <script>
      AFRAME.registerComponent("gltf-name-tag", {
        init: function() {
          var targetCube = new THREE.WebGLRenderTargetCube(512, 512);
          var renderer = this.el.sceneEl.renderer;

          this.el.addEventListener("model-loaded", e => {
            let mesh = this.el.getObject3D("mesh");
            
            var texture = new THREE.TextureLoader().load(
              "./assets/cubemap/env.jpg",
              function() {
                var cubeTex = targetCube.fromEquirectangularTexture(renderer, texture);
                mesh.traverse(function(el) {
                  if (el.material) {
                    el.material.envMap = cubeTex.texture;
                    el.material.envMap.intensity = 3;
                    el.material.needsUpdate = true;
                  }
                });
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.outputEncoding = THREE.sRGBEncoding;
              }
            );
          });
        }
      });
    </script>

    <!-- MindAR HTML document -->
    <!-- mouse-detector -->
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/vOECT_target.mind; filterMinCF:.00001; filterBeta: .01; warmupTolerance: 5; missTolerance: 30; maxTrack: 4"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, sortObjects: true, premultipliedAlpha: true, logarithmicDepthBuffer="true"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      >
      
	    <a-light id="dirlight" intensity="1" light="castShadow:true;type:directional" position="1 1 1"></a-light>
      
      <a-assets>
        <a-asset-item id="vOECT_gltf" src="./assets/vOECT_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="OECT_gltf" src="./assets/OECT_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="Neuron_gltf" src="./assets/Neuron_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="Wellplate_gltf" src="./assets/Wellplate_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-entity light="type: ambient; color: #CCC"></a-entity>
      
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable">
        <!-- Preview model shown in front of camera before target is found -->
        <a-gltf-model id="preview-model" position="0 0 -5" rotation="20 -45 -20" scale="0.5 0.5 0.5" src="#vOECT_gltf"
          animation-mixer="timeScale=0, clip=tr_*"
          gltf-name-tag
          gesture-handler>
        </a-gltf-model>
      </a-camera>

      <!-- Make sure to set the gltf object alpha blend on if you want transparency -->
      <a-entity>
        <a-entity id="oect" oect mindar-image-target="targetIndex: 0">
            <a-gltf-model class="clickable" rotation="6 -65 -20" position="0.35 0 0" scale="0.12 0.12 0.12" src="#vOECT_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect2" oect2 mindar-image-target="targetIndex: 1">
            <a-gltf-model class="clickable" rotation="-5 -100 -20" position="-0.4 -0.2 0" scale="0.1 0.1 0.1" src="#OECT_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect3" oect3 mindar-image-target="targetIndex: 2">
            <a-gltf-model class="clickable" rotation="10 -70 -20" position="-0.2 .3 0" scale="0.1 0.1 0.1" src="#Neuron_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect4" oect4 mindar-image-target="targetIndex: 3">
            <a-gltf-model class="clickable" rotation="6 -95 10" position="0.35 -.55 0" scale="0.05 0.05 0.05" src="#Wellplate_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>


    </a-scene>

    <!-- Script to handle touch gestures (Hammer.js) for pinch-scale, pan-rotation, and swipe momentum -->
    <!-- Click/tap an object to select it; gestures only apply to the selected object -->
    <script>
      (function () {
        var instances = [];
        var selectedInst = null;
        var isPanning = false;
        var swipeVelocity = 0;
        var hammerInitialized = false;

        function initHammer() {
          if (hammerInitialized) return;
          hammerInitialized = true;

          var hammertime = new Hammer(document.body);
          hammertime.get('pinch').set({ enable: true });
          hammertime.get('rotate').set({ enable: true });

          // Pinch to scale selected instance
          var savedScaleFactor = 1;
          hammertime.on('pinchstart', function () {
            if (selectedInst) savedScaleFactor = selectedInst.scaleFactor;
          });
          hammertime.on('pinchmove', function (ev) {
            if (!selectedInst) return;
            var inst = selectedInst;
            inst.scaleFactor = Math.min(Math.max(ev.scale * savedScaleFactor, inst.data.minScale), inst.data.maxScale);
            inst.el.object3D.scale.set(
              inst.scaleFactor * inst.initialScale.x,
              inst.scaleFactor * inst.initialScale.y,
              inst.scaleFactor * inst.initialScale.z
            );
          });

          // Rotate using relative rotation (two-finger twist)
          var previousRot = 0;
          hammertime.on('rotatestart', function (ev) {
            previousRot = ev.rotation;
          });
          hammertime.on('rotatemove', function (ev) {
            if (!selectedInst) return;
            var newRot = (ev.rotation - previousRot) * Math.PI / 180;
            selectedInst.el.object3D.rotation.y += newRot;
            previousRot = ev.rotation;
            var r = selectedInst.el.object3D.rotation;
            console.log('Rotation (deg): x=' + (r.x * 180 / Math.PI).toFixed(1) + ' y=' + (r.y * 180 / Math.PI).toFixed(1) + ' z=' + (r.z * 180 / Math.PI).toFixed(1));
          });

          // Pan to rotate selected instance (single finger)
          var previousPanX = 0;
          var previousPanY = 0;
          hammertime.on('panstart', function (ev) {
            isPanning = true;
            previousPanX = ev.deltaX;
            previousPanY = ev.deltaY;
          });
          hammertime.on('panmove', function (ev) {
            if (!selectedInst) return;
            isPanning = true;
            var deltaX = ev.deltaX - previousPanX;
            var deltaY = ev.deltaY - previousPanY;
            selectedInst.el.object3D.rotation.y += deltaX * Math.PI / 360;
            selectedInst.el.object3D.rotation.x += deltaY * Math.PI / 360;
            var r = selectedInst.el.object3D.rotation;
            console.log('Rotation (deg): x=' + (r.x * 180 / Math.PI).toFixed(1) + ' y=' + (r.y * 180 / Math.PI).toFixed(1) + ' z=' + (r.z * 180 / Math.PI).toFixed(1));
            previousPanX = ev.deltaX;
            previousPanY = ev.deltaY;
          });
          hammertime.on('panend', function () { isPanning = false; });
          hammertime.on('pancancel', function () { isPanning = false; });

          // Swipe for momentum rotation
          hammertime.on('swipeleft', function (ev) { swipeVelocity = ev.velocity; });
          hammertime.on('swiperight', function (ev) { swipeVelocity = ev.velocity; });
        }

        AFRAME.registerComponent('gesture-handler', {
          schema: {
            minScale: { default: 0.1 },
            maxScale: { default: 3 }
          },

          init: function () {
            this.initialScale = this.el.object3D.scale.clone();
            this.scaleFactor = 1;
            instances.push(this);
            // Auto-select the first instance (preview model)
            if (instances.length === 1) selectedInst = this;
            initHammer();

            // Click/tap to select this object via A-Frame cursor raycaster
            var self = this;
            this.el.addEventListener('click', function () {
              selectedInst = self;
              console.log('Selected:', self.el.id || self.el.tagName);
            });
          },

          remove: function () {
            var idx = instances.indexOf(this);
            if (idx !== -1) instances.splice(idx, 1);
            if (selectedInst === this) selectedInst = instances[0] || null;
          },

          tick: function () {
            // Only the first instance drives the shared swipe momentum
            if (instances[0] !== this) return;
            if (!(swipeVelocity && !isPanning && selectedInst)) return;
            selectedInst.el.object3D.rotation.y += swipeVelocity * 4 * Math.PI / 360;
            swipeVelocity *= 0.93;
            if (Math.abs(swipeVelocity) <= 0.1) swipeVelocity = 0;
          }
        });
      })();
    </script>

    <!-- Script to register the targetFound and targetLost events -->
    <script>
      AFRAME.registerComponent('oect', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target found");
            // Hide the preview model
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {
            console.log("target lost");
            // Show the preview model again
            preview.object3D.visible = true;
          });
        }
      });

      AFRAME.registerComponent('oect2', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target 2 found");
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {
            console.log("target 2 lost");
            preview.object3D.visible = true;
          });
        }
      });

      AFRAME.registerComponent('oect3', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target 3 found");
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {
            console.log("target 3 lost");
            preview.object3D.visible = true;
          });
        }
      });

      AFRAME.registerComponent('oect4', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target 4 found");
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {

            preview.object3D.visible = true;
          });
        }
      });
    </script>

    </body>
  </html>
