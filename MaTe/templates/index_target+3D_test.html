<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
  </head>
  <body>
    
    <!-- Buttons to freeze/unfreeze the AR -->
    <div id="arButtons" style="position: absolute; z-index: 10000;">
      <button id="pause-keep-video-button">Freeze</button>
      <button id="unpause-button">Unfreeze</button>
    </div>

    <!-- Script to freeze/unfreeze AR -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        let arSystem;
        sceneEl.addEventListener('loaded', function () {
          arSystem = sceneEl.systems["mindar-image-system"];
        });
        document.querySelector("#pause-keep-video-button").addEventListener('click', () => {
          if (arSystem) arSystem.pause(true); // pause AR, keep video
          sceneEl.pause(); // pause the A-Frame scene (stops gestures, animations, ticks)
        });
        document.querySelector("#unpause-button").addEventListener('click', () => {
          sceneEl.play(); // resume the A-Frame scene
          if (arSystem) arSystem.unpause(); // unpause AR and video
        });
      });
    </script>

    <style>
      #arButtons {
        position: absolute;
        top: 2%;
        right: 2%;
        z-index: 10000;
      }

      #pause-keep-video-button {
        font-size: 20px;
      }
      #unpause-button {
        font-size: 20px;
      }
    </style>

    <!-- Script to set the environment texture -->
    <script>
      AFRAME.registerComponent("gltf-name-tag", {
        init: function() {
          var targetCube = new THREE.WebGLRenderTargetCube(512, 512);
          var renderer = this.el.sceneEl.renderer;

          this.el.addEventListener("model-loaded", e => {
            let mesh = this.el.getObject3D("mesh");
            
            var texture = new THREE.TextureLoader().load(
              "./assets/cubemap/env.jpg",
              function() {
                var cubeTex = targetCube.fromEquirectangularTexture(renderer, texture);
                mesh.traverse(function(el) {
                  if (el.material) {
                    el.material.envMap = cubeTex.texture;
                    el.material.envMap.intensity = 3;
                    el.material.needsUpdate = true;
                  }
                });
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.outputEncoding = THREE.sRGBEncoding;
              }
            );
          });
        }
      });
    </script>

    <!-- MindAR HTML document -->
    <!-- mouse-detector -->
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/vOECT_target.mind; filterMinCF:.01; filterBeta: 1; warmupTolerance: 5; missTolerance: 30; maxTrack: 4"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, sortObjects: true, premultipliedAlpha: true, logarithmicDepthBuffer="true"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      >
      
	    <a-light id="dirlight" intensity="1" light="castShadow:true;type:directional" position="1 1 1"></a-light>
      
      <a-assets>
        <a-asset-item id="vOECT_gltf" src="./assets/vOECT_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="OECT_gltf" src="./assets/OECT_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="Neuron_gltf" src="./assets/Neuron_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-assets>
        <a-asset-item id="Wellplate_gltf" src="./assets/Wellplate_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-entity light="type: ambient; color: #CCC"></a-entity>
      
      <a-camera position="0 0 0" look-controls="enabled: false">
        <!-- Preview model shown in front of camera before target is found -->
        <a-gltf-model id="preview-model" position="0 0 -5" rotation="20 -45 -20" scale="0.5 0.5 0.5" src="#vOECT_gltf"
          animation-mixer="timeScale=0, clip=tr_*"
          gltf-name-tag
          gesture-handler>
        </a-gltf-model>
      </a-camera>

      <!-- Make sure to set the gltf object alpha blend on if you want transparency -->
      <a-entity>
        <a-entity id="oect" oect mindar-image-target="targetIndex: 0">
            <a-gltf-model rotation="20 -45 -20" position="0.35 0 0" scale="0.12 0.12 0.12" src="#vOECT_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect2" oect2 mindar-image-target="targetIndex: 1">
            <a-gltf-model rotation="20 -45 -20" position="-0.4 -0.2 0" scale="0.1 0.1 0.1" src="#OECT_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect3" oect3 mindar-image-target="targetIndex: 2">
            <a-gltf-model rotation="20 -45 -20" position="-0.2 .3 0" scale="0.1 0.1 0.1" src="#Neuron_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>

      <a-entity>
        <a-entity id="oect4" oect4 mindar-image-target="targetIndex: 3">
            <a-gltf-model rotation="20 -45 -20" position="0.35 -.55 0" scale="0.05 0.05 0.05" src="#Wellplate_gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>


    </a-scene>

    <!-- Script to handle touch gestures (Hammer.js) for pinch-scale, pan-rotation, and swipe momentum -->
    <!-- Uses a shared Hammer instance so all gesture-handler elements rotate/scale together -->
    <script>
      (function () {
        // Shared state across all gesture-handler instances
        var instances = [];
        var isPanning = false;
        var swipeVelocity = 0;
        var hammerInitialized = false;

        function initHammer() {
          if (hammerInitialized) return;
          hammerInitialized = true;

          var hammertime = new Hammer(document.body);
          hammertime.get('pinch').set({ enable: true });

          // Pinch to scale all instances
          var savedScaleFactors = [];
          hammertime.on('pinchstart', function () {
            savedScaleFactors = instances.map(function (inst) { return inst.scaleFactor; });
          });
          hammertime.on('pinchmove', function (ev) {
            instances.forEach(function (inst, i) {
              var startFactor = savedScaleFactors[i] || inst.scaleFactor;
              inst.scaleFactor = Math.min(Math.max(ev.scale * startFactor, inst.data.minScale), inst.data.maxScale);
              inst.el.object3D.scale.set(
                inst.scaleFactor * inst.initialScale.x,
                inst.scaleFactor * inst.initialScale.y,
                inst.scaleFactor * inst.initialScale.z
              );
            });
          });

          // Pan to rotate all instances
          hammertime.on('panleft', function () {
            isPanning = true;
            instances.forEach(function (inst) { inst.el.object3D.rotation.y -= 4 * Math.PI / 360; });
          });
          hammertime.on('panright', function () {
            isPanning = true;
            instances.forEach(function (inst) { inst.el.object3D.rotation.y += 4 * Math.PI / 360; });
          });
          hammertime.on('panup', function () {
            isPanning = true;
            instances.forEach(function (inst) { inst.el.object3D.rotation.x -= 4 * Math.PI / 360; });
          });
          hammertime.on('pandown', function () {
            isPanning = true;
            instances.forEach(function (inst) { inst.el.object3D.rotation.x += 4 * Math.PI / 360; });
          });
          hammertime.on('panend', function () { isPanning = false; });
          hammertime.on('pancancel', function () { isPanning = false; });

          // Swipe for momentum rotation
          hammertime.on('swipeleft', function (ev) { swipeVelocity = ev.velocity; });
          hammertime.on('swiperight', function (ev) { swipeVelocity = ev.velocity; });
        }

        AFRAME.registerComponent('gesture-handler', {
          schema: {
            minScale: { default: 0.1 },
            maxScale: { default: 3 }
          },

          init: function () {
            this.initialScale = this.el.object3D.scale.clone();
            this.scaleFactor = 1;
            instances.push(this);
            initHammer();
          },

          remove: function () {
            var idx = instances.indexOf(this);
            if (idx !== -1) instances.splice(idx, 1);
          },

          tick: function () {
            // Only the first instance drives the shared swipe momentum to avoid duplicate updates
            if (instances[0] !== this) return;
            if (!(swipeVelocity && !isPanning)) return;
            instances.forEach(function (inst) {
              inst.el.object3D.rotation.y += swipeVelocity * 4 * Math.PI / 360;
            });
            swipeVelocity *= 0.93;
            if (Math.abs(swipeVelocity) <= 0.1) swipeVelocity = 0;
          }
        });
      })();
    </script>

    <!-- Script to register the targetFound and targetLost events -->
    <script>
      AFRAME.registerComponent('oect', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target found");
            // Hide the preview model
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {
            console.log("target lost");
            // Show the preview model again
            preview.object3D.visible = true;
          });
        }
      });

      AFRAME.registerComponent('oect2', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target 2 found");

          });
          this.el.addEventListener('targetLost', event => {

            preview.object3D.visible = true;
