<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  </head>
  <body>
    
    <!-- Buttons to freeze/unfreeze the AR -->
    <div id="arButtons" style="position: absolute; z-index: 10000;">
      <button id="pause-keep-video-button">Freeze</button>
      <button id="unpause-button">Unfreeze</button>
    </div>

    <!-- Script to freeze/unfreeze AR -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        let arSystem;
        sceneEl.addEventListener('loaded', function () {
          arSystem = sceneEl.systems["mindar-image-system"];
        });
        document.querySelector("#pause-keep-video-button").addEventListener('click', () => {
          arSystem.pause(true); // pause AR, keep video
        });
        document.querySelector("#unpause-button").addEventListener('click', () => {
          arSystem.unpause(); // unpause AR and video
        });
      });
    </script>

    <style>
      #arButtons {
        position: absolute;
        top: 2%;
        right: 2%;
        z-index: 10000;
      }

      #pause-keep-video-button {
        font-size: 20px;
      }
      #unpause-button {
        font-size: 20px;
      }
    </style>

    <!-- Script to set the environment texture -->
    <script>
      AFRAME.registerComponent("gltf-name-tag", {
        init: function() {
          var targetCube = new THREE.WebGLRenderTargetCube(512, 512);
          var renderer = this.el.sceneEl.renderer;

          this.el.addEventListener("model-loaded", e => {
            let mesh = this.el.getObject3D("mesh");
            
            var texture = new THREE.TextureLoader().load(
              "./assets/cubemap/env.jpg",
              function() {
                var cubeTex = targetCube.fromEquirectangularTexture(renderer, texture);
                mesh.traverse(function(el) {
                  if (el.material) {
                    el.material.envMap = cubeTex.texture;
                    el.material.envMap.intensity = 3;
                    el.material.needsUpdate = true;
                  }
                });
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.outputEncoding = THREE.sRGBEncoding;
              }
            );
          });
        }
      });
    </script>

    <!-- MindAR HTML document -->
    <!-- mouse-detector -->
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/OECT_scale1.mind; filterMinCF:0.0001; filterBeta: 0.00001; warmupTolerance: 5; missTolerance: 30;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, sortObjects: true, premultipliedAlpha: true, logarithmicDepthBuffer="true"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gesture-detector
      >
      
	    <a-light id="dirlight" intensity="1" light="castShadow:true;type:directional" position="1 1 1"></a-light>
      
      <a-assets>
        <a-asset-item id="gltf" src="./assets/vOECT_gltf.gltf"></a-asset-item>
      </a-assets>
      
      <a-entity light="type: ambient; color: #CCC"></a-entity>
      
      <a-camera position="0 0 0" look-controls="enabled: false">
        <!-- Preview model shown in front of camera before target is found -->
        <a-gltf-model id="preview-model" position="0 0 -5" rotation="20 -45 -20" scale="0.3 0.3 0.3" src="#gltf"
          animation-mixer="timeScale=0, clip=tr_*"
          gltf-name-tag
          gesture-handler>
        </a-gltf-model>
      </a-camera>
      
      <!-- Make sure to set the gltf object alpha blend on if you want transparency -->
      <a-entity>
        <a-entity id="oect" oect mindar-image-target="targetIndex: 0">
            <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.4 0.4 0.4" src="#gltf" 
            animation-mixer="timeScale=0, clip=tr_*"
            gltf-name-tag
            gesture-handler>
          </a-entity>
      </a-entity>
      
      <!-- <a-entity mouse-rotation="rotationFactor: 5" gesture-rotation="rotationFactor: 2">
      </a-entity> -->

    </a-scene>

    <!-- Script to handle touch gestures for rotation and scale -->
    <script>
      AFRAME.registerComponent('gesture-handler', {
        schema: {
          rotationFactor: { default: 5 },
          minScale: { default: 0.1 },
          maxScale: { default: 3 }
        },

        init: function () {
          this.handleRotation = this.handleRotation.bind(this);
          this.handleScale = this.handleScale.bind(this);
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;

          this.el.sceneEl.addEventListener('onefingermove', this.handleRotation);
          this.el.sceneEl.addEventListener('twofingermove', this.handleScale);
        },

        remove: function () {
          this.el.sceneEl.removeEventListener('onefingermove', this.handleRotation);
          this.el.sceneEl.removeEventListener('twofingermove', this.handleScale);
        },

        handleRotation: function (event) {
          // Rotate based on finger movement delta
          this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
          this.el.object3D.rotation.x += event.detail.positionChange.y * this.data.rotationFactor;
        },

        handleScale: function (event) {
          this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
          this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);

          this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
          this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
          this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
        }
      });
    </script>

    <!-- Script to register the targetFound and targetLost events -->
    <script>
      AFRAME.registerComponent('oect', {
        init: function () {
          const preview = document.getElementById('preview-model');

          this.el.addEventListener('targetFound', event => {
            console.log("target found");
            // Hide the preview model
            preview.object3D.visible = false;
          });
          this.el.addEventListener('targetLost', event => {
            console.log("target lost");
            // Show the preview model again
            preview.object3D.visible = true;
          });
        }
      });
    </script>

    </body>
  </html>
